<!DOCTYPE html>
<html lang="es" style="margin:0;padding:0;min-height:100%;width:100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Flota y Equipos</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:#f4f6f8; color:#243342; }
    header { min-height:58px; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:#25313e; color:white; box-shadow:0 2px 5px #0002; }
    .brand { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:650; }
    #db-badge { border:1px solid #4f6378; background:#384a5d; color:#9bd0ff; border-radius:14px; padding:4px 9px; font-size:12px; font-weight:600; }
    nav { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
    button, select { min-height:36px; border:1px solid #ffffff55; border-radius:5px; padding:7px 12px; color:#e9eef3; background:#ffffff12; font-size:13px; font-weight:600; cursor:pointer; }
    button[aria-selected="true"] { color:white; background:#0076ce; border-color:#0076ce; }
    select { color:#243342; background:white; border-color:#b8c2cc; }
    main { height:calc(100vh - 58px); min-height:420px; }
    iframe { display:block; width:100%; height:100%; border:0; background:white; }
    @media (max-width:640px) { header { align-items:flex-start; } nav { width:100%; } button { flex:1; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">Gestión de Flota y Equipos <span id="db-badge">BD: Cargando…</span></div>
    <nav aria-label="Secciones del add-in">
      <button id="form-request" data-view="request" aria-selected="true">Solicitud de equipos</button>
      <button id="form-movement" data-view="movement" aria-selected="false">Registrar movimiento</button>
      <button id="sheet-view" data-view="sheet" aria-selected="false">Base de datos</button>
      <select id="sheet-tab" aria-label="Pestaña de la hoja" hidden></select>
    </nav>
  </header>
  <main><iframe id="content-frame" title="Contenido de Gestión de Flota y Equipos" allow="clipboard-read; clipboard-write"></iframe></main>
  <script>
    // Add-in independiente: no modifica el add-in de Gestión de Trabajos.
    const FORMS = {
      request: 'https://docs.google.com/forms/d/e/1FAIpQLScMM5lH-fuFvI_LRRpTixbrHlv3TPMmbTpy3-2ZsG5qdKLZZw/viewform?embedded=true',
      movement: 'https://docs.google.com/forms/d/e/1FAIpQLScUEld2hfs-dVPxXu-UOjPDmKFdU0UdkFEhfPPRNAZ3TTZ4rw/viewform?embedded=true'
    };
    const SPREADSHEET_ID = '1ZW_buZY3C_vx8jcgQW_27us3BZB77NBhDOsfbK0rgCU';
    // Deja vacío hasta verificar el ID de la pregunta de base de datos del formulario.
    const DATABASE_ENTRY_ID = '';
    const SHEET_TABS = [
      { name: 'Panel de Control', gid: '233803455' },
      { name: 'Base de Empresas', gid: '0' },
      { name: 'Inventario de Equipos', gid: '520243698' },
      { name: 'Registro de Movimientos', gid: '162404664' },
      { name: 'Solicitudes y Pedidos', gid: '2097558297' },
      { name: 'Respuestas de formulario 1', gid: '2131132008' },
      { name: 'Respuestas de formulario 2', gid: '1546913711' }
    ];

    const frame = document.getElementById('content-frame');
    const selector = document.getElementById('sheet-tab');
    let activeView = 'request';
    let databaseName = '';

    function sheetUrl(gid) {
      return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/edit?gid=${encodeURIComponent(gid)}#gid=${encodeURIComponent(gid)}`;
    }
    function applyDatabase(name) {
      databaseName = name || 'Desconocida';
      document.getElementById('db-badge').textContent = `BD: ${databaseName}`;
      if (activeView === 'request') {
        frame.src = requestFormUrl();
      }
    }
    function requestFormUrl() {
      if (!DATABASE_ENTRY_ID) return FORMS.request;
      const separator = FORMS.request.includes('?') ? '&' : '?';
      return `${FORMS.request}${separator}${encodeURIComponent(DATABASE_ENTRY_ID)}=${encodeURIComponent(databaseName)}`;
    }
    function setView(view) {
      activeView = view;
      document.querySelectorAll('nav button').forEach(button => {
        button.setAttribute('aria-selected', String(button.dataset.view === view));
      });
      selector.hidden = view !== 'sheet';
      if (view === 'request') {
        frame.src = requestFormUrl();
      } else if (view === 'movement') {
        frame.src = FORMS.movement;
      } else {
        frame.src = sheetUrl(selector.value || SHEET_TABS[0].gid);
      }
    }
    SHEET_TABS.forEach((tab, index) => selector.add(new Option(tab.name, tab.gid, index === 0, index === 0)));
    document.querySelectorAll('nav button').forEach(button => button.addEventListener('click', () => setView(button.dataset.view)));
    selector.addEventListener('change', () => { if (activeView === 'sheet') frame.src = sheetUrl(selector.value); });

    geotab.addin.fleetEquipment = function (api, initialState) {
      return {
        initialize: function (api, state, callback) {
          const db = (state && state.database) || (initialState && initialState.database);
          if (db) { applyDatabase(db); callback(); return; }
          if (api && typeof api.getSession === 'function') {
            api.getSession(function (session) { applyDatabase(session && session.database); callback(); });
          } else { applyDatabase('Desconocida'); callback(); }
        },
        focus: function () {},
        blur: function () {}
      };
    };
  </script>
</body>
</html>
